# gitleaks configuration for polaris-shield.
#
# Extends the stock ruleset rather than replacing it: `useDefault = true` starts from every upstream
# rule.
#
# That is a starting point, not a guarantee. This file used to claim it "can only ever ADD an
# exception, never silently drop a detection". That was false, and nothing checked it: the same
# [extend] table accepts `disabledRules`, which switches stock rules off, and a wide enough
# allowlist suppresses their findings just as effectively. Adding
# `disabledRules = ["aws-access-token", "slack-bot-token"]` here left the whole secret-scan job
# green while the full-history scan went from "leaks found: 2" to "no leaks found" on a tree
# carrying one of each.
#
# So the property is now enforced instead of asserted. The teeth step in
# .github/workflows/secret-scan.yml plants two findings in a throwaway repository and requires BOTH
# RuleIDs in gitleaks' JSON report: `teeth-canary`, from a rule that step defines, and
# `aws-access-token`, which only the stock ruleset provides. Disabling that stock rule here, or
# allowlisting its findings away, turns the teeth step red and with it the job. Note that a
# disabled `aws-access-token` still leaves the planted key caught by `generic-api-key`, so the
# check has to look at WHICH rules fired, not at the count or the exit code.
#
# The scope of that guarantee, stated rather than implied: one stock rule is a canary for the
# `disabledRules` axis, not a proof for every rule on it. Switching off some other stock rule would
# still pass. Widening the canary means planting more findings in that step.
[extend]
useDefault = true

# ---------------------------------------------------------------------------------------------
# ONE path allowlist, and it needs justifying rather than asserting.
#
# `acvp/acvp_vectors.json` is the vendored NIST ACVP corpus. A full-history scan reports 35
# `generic-api-key` findings in it — every one a high-entropy hex string from a PUBLISHED
# standardised test vector, which is what that file is made of. Nothing in it is a credential and
# nothing in it is ours.
#
# Normally a path exclusion is the wrong tool: it produces a check that no input can defeat, which
# is exactly the defect class this project's risk register documents. It is defensible HERE, and
# only here, because the file is already covered by a STRONGER, content-addressed control:
#
#   test_corpus_integrity.py pins the corpus by SHA-256 (CRLF-normalised, so the digest is a
#   property of the corpus rather than of the checkout platform).
#
# That control was mutation-tested before this exclusion was written, not assumed. Flipping a
# single byte of the corpus produces:
#
#   FAILED test_corpus_integrity.py::test_corpus_digest_is_pinned[acvp_vectors.json]
#   AssertionError: acvp/acvp_vectors.json does not match its pinned digest — the vendored NIST
#   ACVP corpus changed; refresh deliberately and update this digest.
#
# So a secret cannot be ADDED to this file without a test going red. gitleaks is not the control
# for it; the digest is. The alternative — 35 individual fingerprints — would break on any
# legitimate corpus refresh and teach whoever hits that to delete the lot.
#
# If the digest pin is ever removed, this exclusion must be removed with it.
# The path regex is anchored. gitleaks matches allowlist paths with Go's regexp MatchString, which is a
# substring match, so an unanchored 'acvp/acvp_vectors\.json' would also exempt
# 'acvp/acvp_vectors.json.bak' or 'vendor/acvp/acvp_vectors.json.old'. Only the one pinned file is
# covered by the digest control above, so only the one pinned file is exempt.
[allowlist]
description = "Vendored NIST ACVP test vectors, covered by the SHA-256 pin in test_corpus_integrity.py"
paths = ['''^acvp/acvp_vectors\.json$''']
