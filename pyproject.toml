[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vorlath-shield"
version = "2.1.0"
description = "VORLATH Shield — algorithm-agile post-quantum hybrid security (FIPS 203/204, CNSA 2.0 algorithm set). Reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Brandon J. Sellam" }]
keywords = ["post-quantum", "ML-KEM", "ML-DSA", "FIPS-203", "FIPS-204", "CNSA-2.0", "hybrid", "cryptography"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
]
# PQ reference libraries pinned exactly so the deterministic KAT vectors cannot silently drift.
dependencies = [
  "kyber-py==1.2.0",
  "dilithium-py==1.4.0",
  "slh-dsa==0.2.3",
  "cryptography>=50.0.0,<51",   # >=50.0.0 clears PYSEC-2026-3552/3553/3554 (PKCS#7 oracle; cert-chain path-building DoS; DNS name-constraint escape). 3553/3554 are fixed in 49.0.0, 3552 only in 50.0.0, so 50 is the floor. <51 matches requirements.txt + the Dockerfile major>=50 gate
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[project.scripts]
vorlath-shield = "vorlath_shield.__main__:main"

[project.urls]
Homepage = "https://github.com/brandonjsellam-Releone/vorlath-shield"
Source = "https://github.com/brandonjsellam-Releone/vorlath-shield"

[tool.hatch.build.targets.wheel]
packages = ["vorlath_shield"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# "S" is flake8-bandit. It is here as the LINT BACKSTOP for the TNO deprecated-primitive
# claim: S324 flags an insecure hash (MD5/SHA-1) at the call site, so a stray primitive is
# caught even before test_tno_code_derived.py's AST scan sees it. Two independent
# mechanisms, because the claim in TNO_PQC_SELF_ASSESSMENT.md is made to a
# government-facing reader and was, until now, enforced by neither.
select = ["E", "F", "W", "I", "UP", "B", "S"]
# E501 (long lines) and E702 (compact one-line statements) suit the deliberate dense crypto layout.
ignore = ["E501", "E702"]

[tool.ruff.lint.per-file-ignores]
# Negative tests deliberately assert a generic raise: the failure is InvalidTag (from
# `cryptography`) for tamper/wrong-key and ValueError for malformed/suite-mismatch input.
"test_*.py" = [
    "B017",
    # A test asserts; that is its mechanism, not a security smell.
    "S101",
    # Property tests deliberately swallow generation-time errors from Hypothesis.
    "S110",
]
# Vector generators are development tooling, not shipped code. Their asserts are
# self-checks on the vectors being produced - the right mechanism there too.
"gen_*.py" = ["S101"]
"interop/gen_*.py" = ["S101", "S110"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true   # kyber-py / dilithium-py ship no type stubs

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
