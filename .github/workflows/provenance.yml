name: provenance
# Supply-chain attestation for VORLATH Shield: deterministic verification bundle +
# CycloneDX SBOM + cosign (keyless OIDC) signature + SLSA build-provenance attestation.
# Runs on tagged releases and can be dispatched manually. Honest scope: this attests WHAT was
# built and that it traces to this repo's OIDC identity — it is not a FIPS/CMVP validation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # publish assets to the release
  id-token: write        # keyless cosign + provenance need the OIDC token
  attestations: write    # actions/attest-build-provenance

# Every action below is pinned to a full commit SHA, not a floating tag. This job holds
# contents:write + id-token:write + attestations:write, so a mutable `@vN` tag would let an
# upstream (or a compromised upstream account) silently swap the code that runs with those
# privileges. The trailing comment records the human-readable version each SHA corresponds to.
jobs:
  bundle-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build deterministic verification bundle + SBOM baseline
        run: |
          python sbom/make_sbom.py
          python release/make_bundle.py
          echo "BUNDLE_DIGEST=$(python -c 'import json;print(json.load(open("release/RELEASE_MANIFEST.json"))["bundle_digest"])')" >> "$GITHUB_ENV"
          # The `sha256sum -c release/RELEASE_MANIFEST.sha256` that used to sit here has been
          # removed. It ran immediately AFTER make_bundle.py wrote that manifest, so it compared
          # freshly-generated hashes to the files they had just been generated from: 70 lines of
          # "OK" that could not fail. Demonstrated by tampering with a source file and running
          # this exact order - the tamper was invisible, exit 0.
          #
          # It cannot simply be moved earlier, either: RELEASE_MANIFEST.{json,sha256} are
          # gitignored (.gitignore:18-19) as build output, so on a clean checkout there is no
          # prior manifest to check against. A self-check needs a baseline that arrives
          # independently of the build, and this one has none.
          #
          # The real integrity control for a release is the cosign keyless signature over the
          # bundle, which binds the artifact to this repo's OIDC identity and is verifiable by a
          # third party. That is unaffected by this removal. What is removed is a step that
          # looked like a second, independent control and was not.

      - name: Full transitive SBOM (resolved environment)
        run: |
          python -m pip install --quiet -r requirements.txt cyclonedx-bom==7.3.0
          cyclonedx-py environment --output-format JSON -o sbom/sbom.full.cdx.json || \
            cyclonedx-py requirements --output-format JSON -o sbom/sbom.full.cdx.json requirements.txt

      - name: Package the signed payloads
        run: |
          # cbom is in this list because release/make_bundle.py's INCLUDE list hashes
          # cbom/cbom.cdx.json. The two lists are separate statements of "what is in the bundle"
          # and they had drifted: the v2.1.0 tarball had no cbom/ entry while the manifest signed
          # beside it listed cbom/cbom.cdx.json. The step after this one is what catches the next
          # drift, and it checks both directions of it: a manifest line with no file, and a file
          # with no manifest line. Each direction needs its own command; see there.
          tar -czf vorlath-shield-bundle.tar.gz \
            vorlath_shield formal acvp interop sidechannel \
            *.md *.py kat_vectors.json requirements.txt pyproject.toml Dockerfile \
            sbom cbom release

      - name: Check the packaged bundle against its own manifest
        run: |
          set -euo pipefail
          # cosign signs RELEASE_MANIFEST.json below, so the manifest has to describe the bytes
          # that actually ship. Extract what was just packaged and check it against the manifest in
          # the extracted tree, not against the working directory those hashes came from.
          rm -rf "$RUNNER_TEMP/bundle-check"
          mkdir -p "$RUNNER_TEMP/bundle-check"
          tar -xzf vorlath-shield-bundle.tar.gz -C "$RUNNER_TEMP/bundle-check"
          cd "$RUNNER_TEMP/bundle-check"

          # Direction 1 - every manifest line resolves, and to the right bytes. On the v2.1.0
          # bundle this exact command exits 1 with
          #   cbom/cbom.cdx.json: FAILED open or read
          # which is the defect it exists to catch.
          sha256sum -c release/RELEASE_MANIFEST.sha256

          # Direction 2 - nothing ships that the manifest does not attest. `sha256sum -c` cannot
          # see this: it only ever walks the lines it is handed, so a file that leaves the manifest
          # while staying in the tar list passes it silently. Reproduced by dropping
          # "cbom/cbom.cdx.json" from release/make_bundle.py's INCLUDE and leaving cbom in the tar
          # list above: 72 manifest lines, all OK, exit 0, and cbom/cbom.cdx.json shipping inside a
          # bundle whose cosign signature no longer covers it. That is the v2.1.0 drift in the
          # other direction and it is the worse of the two.
          #
          # The exceptions are named one by one rather than globbed away. Two are the manifest
          # itself, which cannot hash itself (make_bundle.py EXCLUDEs it). The other eight are
          # packaging scripts, release tooling and docs that INCLUDE deliberately does not cover,
          # plus the resolved-environment SBOM, which is generated after the manifest is written.
          # A file appearing here that is not on this list is a question worth answering - should
          # this ship without being signed for? - so the job stops until someone answers it.
          cat > "$RUNNER_TEMP/unattested-allowed.txt" <<'EOF'
          CONTRIBUTING.md
          cbom/make_cbom.py
          release/README.md
          release/RELEASE_MANIFEST.json
          release/RELEASE_MANIFEST.sha256
          release/lms.Dockerfile
          release/make_bundle.py
          release/sign_lms.py
          sbom/make_sbom.py
          sbom/sbom.full.cdx.json
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/unattested-allowed.txt" "$RUNNER_TEMP/unattested-allowed.txt"
          awk '{print $2}' release/RELEASE_MANIFEST.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/attested.txt"
          find . -type f | sed 's|^\./||' | LC_ALL=C sort > "$RUNNER_TEMP/shipped.txt"
          unattested="$(LC_ALL=C comm -23 "$RUNNER_TEMP/shipped.txt" "$RUNNER_TEMP/attested.txt" \
                        | LC_ALL=C comm -23 - "$RUNNER_TEMP/unattested-allowed.txt")"
          if [ -n "$unattested" ]; then
            echo "::error::these files ship inside the bundle but no line of the cosign-signed manifest attests them:"
            printf '%s\n' "$unattested" | sed 's/^/  /'
            exit 1
          fi
          echo "bundle check: $(wc -l < "$RUNNER_TEMP/attested.txt") files attested by the manifest," \
               "$(wc -l < "$RUNNER_TEMP/unattested-allowed.txt") named exceptions, nothing else in the tarball"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Cosign (keyless) sign the bundle manifest + SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob --yes \
            --output-signature   vorlath-shield-bundle.sig \
            --output-certificate vorlath-shield-bundle.pem \
            release/RELEASE_MANIFEST.json
          cosign sign-blob --yes \
            --output-signature   sbom.cdx.sig \
            --output-certificate sbom.cdx.pem \
            sbom/sbom.cdx.json

      - name: SLSA build-provenance attestation for the bundle
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: vorlath-shield-bundle.tar.gz

      - name: Publish verification assets to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            vorlath-shield-bundle.tar.gz
            release/RELEASE_MANIFEST.json
            release/RELEASE_MANIFEST.sha256
            vorlath-shield-bundle.sig
            vorlath-shield-bundle.pem
            sbom/sbom.cdx.json
            sbom/sbom.full.cdx.json
            sbom.cdx.sig
            sbom.cdx.pem
