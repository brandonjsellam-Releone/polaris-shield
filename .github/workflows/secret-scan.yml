name: secret-scan

# Every secret this repo could leak is already public if it leaks once, so the scan runs over FULL
# history rather than the pushed range. A credential committed and later "removed" is still in the
# git objects, and range-scoped scanning is exactly how those get missed.
#
# Added 2026-08-13: this repo had no secret scanning on any trigger. Nothing was leaking — the
# history was scanned with gitleaks 8.30.1 before this was written, and every finding traced to a
# false positive. The point of adding it now is that nothing would have caught the first real one.
#
# Changed 2026-09-17: the job above was green without doing the job. gitleaks/gitleaks-action v2.3.7
# declares no inputs, so the `config`, `fail` and `log-opts` values handed to it were all discarded
# ("Unexpected input(s)" in the log); it scanned a commit range rather than the full history, and it
# ran gitleaks 8.16.1, not 8.30.1. Run 31892521224 passed after scanning 1 commit. The action is
# replaced by gitleaks 8.30.1 downloaded and SHA-256 verified here and invoked directly over every
# ref, plus a teeth check that goes red if the scan scope is ever narrowed again or if a catch-all
# allowlist is ever added to .gitleaks.toml.
#
# Strengthened 2026-09-17: that teeth check asserted only that gitleaks exited 3, so it was blind to
# a third way of blinding the scan. Adding `disabledRules = ["aws-access-token", "slack-bot-token"]`
# to .gitleaks.toml left the teeth step green (its one planted finding was matched by a rule the
# step defines itself, which no upstream change can disable) while the real scan over a tree
# carrying one of each went from "leaks found: 2" to "no leaks found". The step now plants a second
# finding that only a STOCK rule matches and requires both RuleIDs in gitleaks' JSON report.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. gitleaks' ruleset changes without this repo changing, so a scan that only fires on
    # push cannot notice a newly-detectable pattern in code that has been sitting there for months.
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GITLEAKS_LOG_OPTS: "--all"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Required for --log-opts=--all to reach anything but the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The teeth check uses the SAME log-opts and the SAME repo config as the real scan, so narrowing
      # the scan scope, adding a catch-all allowlist, or switching a stock rule off with
      # `disabledRules` turns this step red.
      #
      # Two findings are planted, not one, and the difference matters. TEETH_CANARY_... is matched by
      # a rule this step defines, so it proves scope and allowlists but survives any change to the
      # stock ruleset. The synthetic AWS access key id is matched by the STOCK `aws-access-token`
      # rule, so it is the canary for `disabledRules`. Requiring both RuleIDs in the JSON report is
      # what gives that second axis teeth: with `aws-access-token` disabled the same planted key is
      # still reported, by `generic-api-key`, so the exit code and the finding count are both
      # unchanged and only the rule NAMES reveal the hole.
      #
      # The key id is assembled from two string literals at run time so that the scannable form
      # never exists in this repository, and it is synthetic: 'TEETHCANARY23456' is not an account.
      - name: Teeth check (planted findings from one custom rule and one stock rule must both be found)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/teeth"; cfg="$RUNNER_TEMP/teeth.toml"; rep="$RUNNER_TEMP/teeth.json"
          rm -rf "$d" "$rep"; mkdir -p "$d"
          if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ]; then
            printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/.gitleaks.toml" > "$cfg"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg"
          fi
          cat >> "$cfg" <<'EOF'

          [[rules]]
          id = "teeth-canary"
          regex = '''TEETH_CANARY_[0-9]{8}'''
          EOF
          g() { git -C "$d" -c user.name=ci -c user.email=ci@invalid "$@"; }
          g init -q -b main
          akid="AKIA""TEETHCANARY23456"
          { echo "planted TEETH_CANARY_12345678"; printf 'aws_key = "%s"\n' "$akid"; } > "$d/planted.txt"
          g add planted.txt && g commit -qm planted
          g checkout -q --orphan clean
          g rm -q --cached planted.txt && rm "$d/planted.txt"
          echo ok > "$d/ok.txt" && g add ok.txt && g commit -qm clean
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --log-opts="$GITLEAKS_LOG_OPTS" --report-format json --report-path "$rep" \
            --exit-code 3 --no-banner "$d"
          rc=$?
          set -e
          [ "$rc" -eq 3 ] || { echo "::error::teeth check expected exit 3, got $rc"; exit 1; }
          python3 - "$rep" <<'PY'
          import json, sys

          rules = sorted({f["RuleID"] for f in json.load(open(sys.argv[1], encoding="utf-8"))})
          missing = [r for r in ("teeth-canary", "aws-access-token") if r not in rules]
          if missing:
              print("::error::teeth check: planted findings missing for rule(s) %s; "
                    "the report contains %s" % (", ".join(missing), ", ".join(rules) or "nothing"))
              raise SystemExit(1)
          print("teeth check: rules that fired: %s" % ", ".join(rules))
          PY

      - name: Commits in scope
        run: git rev-list --all --count

      - name: gitleaks over every ref
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="$GITLEAKS_LOG_OPTS" --redact=100 --verbose --no-banner --exit-code 1 .'
